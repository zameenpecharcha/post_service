syntax = "proto3";

package posts;

// Post Message
message Post {
    string id = 1;
    string user_id = 2;
    string user_first_name = 3;
    string user_last_name = 4;
    string user_email = 5;
    string user_phone = 6;
    string user_role = 7;
    string content = 8;
    string title = 9;
    string visibility = 10;
    string type = 11;
    string location = 12;
    double latitude = 22;
    double longitude = 23;
    double price = 14;
    string status = 15;
    int64 created_at = 16;
    repeated PostMedia media = 17;
    repeated Comment comments = 18;
    int32 like_count = 19;
    int32 comment_count = 20;
    bool is_anonymous = 21;
    bool is_liked = 24;
    string post_code = 25;
    string property_id = 26;
    string currency = 27;
    bool is_pinned = 28;
    int64 pinned_at = 29;
    int32 share_count = 30;
    int64 view_count = 31;
    bool allow_comments = 32;
    bool allow_share = 33;
    bool allow_reactions = 34;
    int32 report_count = 35;
}

// Post Media Message
message PostMedia {
    string id = 1;
    string post_id = 2;
    string media_type = 3;
    string media_url = 4;
    int32 media_order = 5;
    int64 media_size = 6;
    string caption = 7;
    int64 uploaded_at = 8;
}

// Comment Message
message Comment {
    string id = 1;
    string post_id = 2;
    string parent_comment_id = 3;
    string comment = 4;
    string user_id = 5;
    string user_first_name = 6;
    string user_last_name = 7;
    string user_role = 8;
    string status = 9;
    int64 added_at = 10;
    int64 commented_at = 11;
    repeated Comment replies = 12;
    int32 like_count = 13;
    bool is_anonymous = 14;
    int64 edited_at = 15;
    int32 reply_count = 16;
    int32 report_count = 17;
}

// Post Like User (for GetPostLikes)
message PostLikeUser {
    string user_id = 1;
    string first_name = 2;
    string last_name = 3;
    string user_role = 4;
    string reaction_type = 5;
    int64 liked_at = 6;
}

// Post Share
message PostShare {
    string id = 1;
    string share_code = 2;
    string post_id = 3;
    string shared_by = 4;
    string share_type = 5;
    string caption = 6;
    string visibility = 7;
    int64 created_at = 8;
    Post post = 9;
}

// Report
message Report {
    string id = 1;
    string report_code = 2;
    string entity_type = 3;
    string entity_id = 4;
    string reported_by = 5;
    string reported_user_id = 6;
    string reason_code = 7;
    string description = 8;
    string status = 9;
    string priority = 10;
    int64 created_at = 11;
    string reviewed_by = 12;
    int64 reviewed_at = 13;
    string action_taken = 14;
    string action_note = 15;
}

// ---------------------------------------------------------------------------
// Requests
// ---------------------------------------------------------------------------

message PostRequest {
    string post_id = 1;
}

message PostCreateRequest {
    string user_id = 1;
    string title = 2;
    string content = 3;
    string visibility = 4;
    string type = 5;
    string location = 6;
    double latitude = 12;
    double longitude = 13;
    double price = 8;
    string status = 9;
    bool is_anonymous = 11;
    repeated PostMediaUpload media = 10;
    string property_id = 14;
    string currency = 15;
}

message PostMediaUpload {
    string media_type = 1;
    bytes media_data = 2;
    int32 media_order = 3;
    string caption = 4;
    string base64_data = 5;
    string file_name = 6;
    string content_type = 7;
    string file_path = 8;
}

message PostUpdateRequest {
    string post_id = 1;
    string title = 2;
    string content = 3;
    string visibility = 4;
    string type = 5;
    string location = 6;
    double latitude = 11;
    double longitude = 12;
    double price = 8;
    string status = 9;
    bool is_anonymous = 10;
    string property_id = 13;
    string currency = 14;
}

message PostMediaRequest {
    string post_id = 1;
    repeated PostMediaUpload media = 2;
    string uploaded_by = 3;
}

message MediaIdRequest {
    string media_id = 1;
}

message LikeRequest {
    string post_id = 1;
    string user_id = 2;
    string reaction_type = 3;
}

message CommentLikeRequest {
    string comment_id = 1;
    string user_id = 2;
    string reaction_type = 3;
}

message CommentCreateRequest {
    string post_id = 1;
    string parent_comment_id = 2;
    string comment = 3;
    string user_id = 4;
    bool is_anonymous = 5;
}

message CommentUpdateRequest {
    string comment_id = 1;
    string comment = 2;
    string status = 3;
}

message GetCommentsRequest {
    string post_id = 1;
    int32 page = 2;
    int32 limit = 3;
}

message GetPostsByUserRequest {
    string user_id = 1;
    int32 page = 2;
    int32 limit = 3;
    string viewer_user_id = 4;
}

message GetMyPostsRequest {
    string user_id = 1;
    int32 page = 2;
    int32 limit = 3;
}

message GetPublicPostsRequest {
    int32 page = 1;
    int32 limit = 2;
    string viewer_user_id = 3;
}

message GetPropertyPostsRequest {
    string property_id = 1;
    int32 page = 2;
    int32 limit = 3;
    string viewer_user_id = 4;
}

message GetBuilderPostsRequest {
    string builder_user_id = 1;
    int32 page = 2;
    int32 limit = 3;
    string viewer_user_id = 4;
    repeated string user_ids = 5;
}

message SearchPostsRequest {
    string type = 1;
    string location = 2;
    double min_price = 3;
    double max_price = 4;
    string status = 5;
    int32 page = 6;
    int32 limit = 7;
    string viewer_user_id = 8;
    string query = 9;
    string hashtag = 10;
}

message TrendingPostsRequest {
    int32 limit = 1;
    string viewer_user_id = 2;
}

message CommentRequest {
    string comment_id = 1;
}

message GetRepliesRequest {
    string comment_id = 1;
    int32 page = 2;
    int32 limit = 3;
}

message PostOwnerRequest {
    string post_id = 1;
    string user_id = 2;
}

message GetPostLikesRequest {
    string post_id = 1;
    int32 page = 2;
    int32 limit = 3;
}

message CheckLikeStatusRequest {
    string post_id = 1;
    string user_id = 2;
}

message SharePostRequest {
    string post_id = 1;
    string shared_by = 2;
    string share_type = 3;
    string caption = 4;
    string visibility = 5;
}

message GetSharedPostsRequest {
    string user_id = 1;
    int32 page = 2;
    int32 limit = 3;
    string viewer_user_id = 4;
}

message DeleteSharedPostRequest {
    string share_id = 1;
    string user_id = 2;
}

message ReportPostRequest {
    string post_id = 1;
    string reported_by = 2;
    string reported_user_id = 3;
    string reason_code = 4;
    string description = 5;
}

message ReportCommentRequest {
    string comment_id = 1;
    string reported_by = 2;
    string reported_user_id = 3;
    string reason_code = 4;
    string description = 5;
}

message ReportPropertyRequest {
    string property_id = 1;
    string reported_by = 2;
    string reported_user_id = 3;
    string reason_code = 4;
    string description = 5;
}

message ReportUserRequest {
    string user_id = 1;
    string reported_by = 2;
    string reason_code = 3;
    string description = 4;
}

message GetMyReportsRequest {
    string reported_by = 1;
    int32 page = 2;
    int32 limit = 3;
}

message GetReportRequest {
    string report_id = 1;
}

message GetReportsRequest {
    string status = 1;
    string entity_type = 2;
    string priority = 3;
    string reported_by = 4;
    string reported_user_id = 5;
    string entity_id = 6;
    int32 page = 7;
    int32 limit = 8;
}

message UpdateReportStatusRequest {
    string report_id = 1;
    string status = 2;
    string reviewed_by = 3;
    string action_taken = 4;
    string action_note = 5;
    string priority = 6;
}

message AssignReportRequest {
    string report_id = 1;
    string reviewed_by = 2;
}

message GetReportsByEntityRequest {
    string entity_type = 1;
    string entity_id = 2;
    int32 page = 3;
    int32 limit = 4;
}

message ReportStatsRequest {
    // optional filters reserved for future (e.g. date range)
    string status = 1;
}

message ReportStatsResponse {
    bool success = 1;
    string message = 2;
    int32 pending_count = 3;
    int32 under_review_count = 4;
    int32 resolved_count = 5;
    int32 rejected_count = 6;
    int32 high_priority_count = 7;
    int32 total_count = 8;
}

// ---------------------------------------------------------------------------
// Responses
// ---------------------------------------------------------------------------

message PostResponse {
    bool success = 1;
    string message = 2;
    Post post = 3;
}

message PostListResponse {
    bool success = 1;
    string message = 2;
    repeated Post posts = 3;
    int32 total_count = 4;
    int32 page = 5;
    int32 total_pages = 6;
}

message CommentListResponse {
    bool success = 1;
    string message = 2;
    repeated Comment comments = 3;
    int32 total_count = 4;
    int32 page = 5;
    int32 total_pages = 6;
}

message CommentResponse {
    bool success = 1;
    string message = 2;
    Comment comment = 3;
}

message GenericResponse {
    bool success = 1;
    string message = 2;
}

message PostLikeListResponse {
    bool success = 1;
    string message = 2;
    repeated PostLikeUser likes = 3;
    int32 total_count = 4;
    int32 page = 5;
    int32 total_pages = 6;
}

message CheckLikeStatusResponse {
    bool success = 1;
    string message = 2;
    bool is_liked = 3;
    string reaction_type = 4;
}

message PostShareResponse {
    bool success = 1;
    string message = 2;
    PostShare share = 3;
}

message PostShareListResponse {
    bool success = 1;
    string message = 2;
    repeated PostShare shares = 3;
    int32 total_count = 4;
    int32 page = 5;
    int32 total_pages = 6;
}

message ReportResponse {
    bool success = 1;
    string message = 2;
    Report report = 3;
}

message ReportListResponse {
    bool success = 1;
    string message = 2;
    repeated Report reports = 3;
    int32 total_count = 4;
    int32 page = 5;
    int32 total_pages = 6;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service PostsService {
    // Post operations
    rpc CreatePost(PostCreateRequest) returns (PostResponse) {}
    rpc GetPost(PostRequest) returns (PostResponse) {}
    rpc UpdatePost(PostUpdateRequest) returns (PostResponse) {}
    rpc DeletePost(PostRequest) returns (GenericResponse) {}
    rpc GetPostsByUser(GetPostsByUserRequest) returns (PostListResponse) {}
    rpc GetMyPosts(GetMyPostsRequest) returns (PostListResponse) {}
    rpc GetPublicPosts(GetPublicPostsRequest) returns (PostListResponse) {}
    rpc GetPropertyPosts(GetPropertyPostsRequest) returns (PostListResponse) {}
    rpc GetBuilderPosts(GetBuilderPostsRequest) returns (PostListResponse) {}
    rpc SearchPosts(SearchPostsRequest) returns (PostListResponse) {}
    rpc TrendingPosts(TrendingPostsRequest) returns (PostListResponse) {}
    rpc PinPost(PostOwnerRequest) returns (PostResponse) {}
    rpc UnpinPost(PostOwnerRequest) returns (PostResponse) {}
    rpc ArchivePost(PostOwnerRequest) returns (PostResponse) {}
    rpc RestoreArchivedPost(PostOwnerRequest) returns (PostResponse) {}

    // Media operations
    rpc AddPostMedia(PostMediaRequest) returns (PostResponse) {}
    rpc DeletePostMedia(MediaIdRequest) returns (GenericResponse) {}

    // Post like operations
    rpc LikePost(LikeRequest) returns (PostResponse) {}
    rpc UnlikePost(LikeRequest) returns (PostResponse) {}
    rpc GetPostLikes(GetPostLikesRequest) returns (PostLikeListResponse) {}
    rpc CheckLikeStatus(CheckLikeStatusRequest) returns (CheckLikeStatusResponse) {}

    // Comment operations
    rpc CreateComment(CommentCreateRequest) returns (CommentResponse) {}
    rpc UpdateComment(CommentUpdateRequest) returns (CommentResponse) {}
    rpc DeleteComment(CommentRequest) returns (GenericResponse) {}
    rpc GetComments(GetCommentsRequest) returns (CommentListResponse) {}
    rpc GetComment(CommentRequest) returns (CommentResponse) {}
    rpc ReplyComment(CommentCreateRequest) returns (CommentResponse) {}
    rpc GetReplies(GetRepliesRequest) returns (CommentListResponse) {}
    rpc LikeComment(CommentLikeRequest) returns (CommentResponse) {}
    rpc UnlikeComment(CommentLikeRequest) returns (CommentResponse) {}
    rpc ReportComment(ReportCommentRequest) returns (ReportResponse) {}

    // Share operations
    rpc SharePost(SharePostRequest) returns (PostShareResponse) {}
    rpc GetSharedPosts(GetSharedPostsRequest) returns (PostShareListResponse) {}
    rpc DeleteSharedPost(DeleteSharedPostRequest) returns (GenericResponse) {}

    // Report operations
    rpc ReportPost(ReportPostRequest) returns (ReportResponse) {}
    rpc ReportProperty(ReportPropertyRequest) returns (ReportResponse) {}
    rpc ReportUser(ReportUserRequest) returns (ReportResponse) {}
    rpc GetMyReports(GetMyReportsRequest) returns (ReportListResponse) {}
    rpc GetReport(GetReportRequest) returns (ReportResponse) {}
    rpc GetReports(GetReportsRequest) returns (ReportListResponse) {}
    rpc UpdateReportStatus(UpdateReportStatusRequest) returns (ReportResponse) {}
    rpc AssignReport(AssignReportRequest) returns (ReportResponse) {}
    rpc GetReportsByEntity(GetReportsByEntityRequest) returns (ReportListResponse) {}
    rpc GetReportStats(ReportStatsRequest) returns (ReportStatsResponse) {}
    rpc DeleteReport(GetReportRequest) returns (GenericResponse) {}
}
